server {
    listen 80;
    listen [::]:80;
    server_name yeninesilbilgiyarismasi.com www.yeninesilbilgiyarismasi.com;

    root /var/www/yeninesilbilgiyarismasi;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    error_page 404 /404.html;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location /_next/static/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
}
