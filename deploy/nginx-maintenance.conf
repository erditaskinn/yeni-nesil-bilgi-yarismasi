server {
    listen 80;
    listen [::]:80;
    server_name yeninesilbilgiyarismasi.com www.yeninesilbilgiyarismasi.com;

    root /var/www/yeninesilbilgiyarismasi;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://yeninesilbilgiyarismasi.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.yeninesilbilgiyarismasi.com;

    ssl_certificate /etc/letsencrypt/live/yeninesilbilgiyarismasi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yeninesilbilgiyarismasi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://yeninesilbilgiyarismasi.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name yeninesilbilgiyarismasi.com;

    ssl_certificate /etc/letsencrypt/live/yeninesilbilgiyarismasi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yeninesilbilgiyarismasi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/yeninesilbilgiyarismasi;
    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    add_header Cache-Control "no-store" always;
    add_header Retry-After "3600" always;
    error_page 503 /maintenance.html;

    location = /maintenance.html {
        internal;
        try_files $uri =404;
    }

    location = /logo-brand.webp {
        try_files $uri =404;
    }

    location / {
        return 503;
    }
}
