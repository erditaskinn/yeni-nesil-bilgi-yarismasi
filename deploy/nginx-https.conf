server {
    listen 80;
    listen [::]:80;
    server_name yeninesilbilgiyarismasi.com www.yeninesilbilgiyarismasi.com;

    root /var/www/yeninesilbilgiyarismasi;

    location ^~ /.well-known/acme-challenge/ {
        try_files $uri =404;
    }

    location / {
        return 301 https://yeninesilbilgiyarismasi.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.yeninesilbilgiyarismasi.com;

    ssl_certificate /etc/letsencrypt/live/yeninesilbilgiyarismasi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yeninesilbilgiyarismasi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://yeninesilbilgiyarismasi.com$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name yeninesilbilgiyarismasi.com;

    ssl_certificate /etc/letsencrypt/live/yeninesilbilgiyarismasi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/yeninesilbilgiyarismasi.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/yeninesilbilgiyarismasi;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header Strict-Transport-Security "max-age=15552000" always;
    error_page 404 /404.html;

    location = /en {
        try_files /en.html =404;
    }

    location = /en/ {
        return 301 /en$is_args$args;
    }

    location ~ ^(/en/.+)/$ {
        return 301 $1$is_args$args;
    }

    location /en/ {
        error_page 404 /en/404.html;
        try_files $uri.html $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location /_next/static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header Strict-Transport-Security "max-age=15552000" always;
    }
}
